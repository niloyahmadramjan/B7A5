<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0F2540"/>
  <!-- Wrench-check signature: a checkmark whose long arm ends in an open-wrench jaw -->
  <path d="M16 34 L27 45 L42 24" fill="none" stroke="#F2542D" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Open-end wrench jaw at the tip -->
  <path d="M42 24 L49 15 M45.5 27.5 L52.5 19" fill="none" stroke="#F2542D" stroke-width="6.5" stroke-linecap="round"/>
</svg>
